[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-audio-ad"
version = "0.1.0"
description = "Acoustic anomaly detection"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["machine_audio_ad"]
package-dir = {machine_audio_ad = "src"}

[tool.setuptools.package-data]
machine_audio_ad = ["static/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
